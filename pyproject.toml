[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uzsarcasm-data"
version = "0.1.0"
description = "Auditable Uzbek sarcasm dataset preparation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "numpy>=1.24", "scikit-learn>=1.3"]

[project.scripts]
uzsarcasm = "uzsarcasm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
